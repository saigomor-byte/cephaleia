name: Diagnostic & Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Afficher la structure des fichiers
        run: |
          echo "=== Contenu de la racine ==="
          ls -la
          echo "=== Recherche des fichiers build.gradle ou gradle ==="
          find . -name "*gradle*" -o -name "AndroidManifest.xml"
